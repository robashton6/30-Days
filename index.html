<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stay Sharp v3 - 30 Day Program</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{background:#080808;color:#f0ede8;font-family:-apple-system,system-ui,sans-serif;font-size:14px;min-height:100vh;}
button{font-family:inherit;cursor:pointer;border:none;}
input,textarea{font-family:inherit;}
textarea{-webkit-appearance:none;border-radius:0;}

.hero{padding:36px 18px 24px;text-align:center;border-bottom:1px solid #2a2a2a;background:linear-gradient(180deg,#111 0%,#080808 100%);}
.hero-badge{display:inline-block;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:#c9a84c;border:1px solid rgba(201,168,76,0.35);padding:5px 13px;margin-bottom:14px;}
.hero-title{font-size:clamp(44px,12vw,72px);line-height:0.9;letter-spacing:1px;margin-bottom:4px;font-weight:700;}
.hero-title span{color:#2a8fb0;}
.hero-sub{font-size:11px;color:#6a6460;margin-top:12px;line-height:1.6;}

.progress-wrap{padding:14px 18px 0;max-width:860px;margin:0 auto;}
.progress-row{display:flex;justify-content:space-between;margin-bottom:7px;}
.progress-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#6a6460;}
.progress-val{font-size:18px;color:#c9a84c;font-weight:700;}
.progress-bar{height:3px;background:#2a2a2a;border-radius:2px;overflow:hidden;margin-bottom:14px;}
.progress-fill{height:100%;background:linear-gradient(90deg,#1a6b8a,#c9a84c);transition:width .5s;}

.tabs{display:flex;overflow-x:auto;border-bottom:1px solid #2a2a2a;background:#111;position:sticky;top:0;z-index:50;-webkit-overflow-scrolling:touch;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:0 0 auto;padding:11px 14px;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#6a6460;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:all .2s;}
.tab.active{color:#2a8fb0;border-bottom-color:#2a8fb0;}
.tab .cnt{margin-left:4px;font-size:9px;color:#c9a84c;}

.main{max-width:860px;margin:0 auto;padding:18px;}
.week-header{margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #2a2a2a;}
.week-title{font-size:26px;color:#2a8fb0;letter-spacing:1px;font-weight:700;}
.week-desc{font-size:11px;color:#6a6460;margin-top:4px;}

.day-card{background:#111;border:1px solid #2a2a2a;margin-bottom:8px;}
.day-card.done{border-color:rgba(26,107,138,0.4);}
.day-header{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer;}
.day-num{font-size:22px;color:#2a2a2a;font-weight:700;min-width:32px;line-height:1;}
.day-card.done .day-num{color:#2a8fb0;}
.day-dow{font-size:9px;color:#6a6460;letter-spacing:1px;text-transform:uppercase;margin-top:2px;}
.day-title{font-size:13px;font-weight:500;margin-bottom:4px;}
.day-week{font-size:9px;color:#6a6460;}
.day-chevron{font-size:11px;color:#6a6460;transition:transform .2s;flex-shrink:0;margin-left:auto;}
.day-card.open .day-chevron{transform:rotate(180deg);}
.day-body{display:none;border-top:1px solid #2a2a2a;}
.day-card.open .day-body{display:block;}

.section{padding:14px;border-bottom:1px solid #222;}
.section-label{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.section-label span{font-size:9px;letter-spacing:2px;text-transform:uppercase;flex-shrink:0;}
.section-label::after{content:'';flex:1;height:1px;background:#2a2a2a;}

.ex-row{display:grid;grid-template-columns:22px 1fr auto;gap:10px;padding:8px 0;border-bottom:1px solid #222;align-items:start;}
.ex-row:last-of-type{border-bottom:none;}
.ex-check{width:20px;height:20px;border:1.5px solid #2a2a2a;border-radius:2px;background:none;color:transparent;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;transition:all .15s;cursor:pointer;}
.ex-row.checked .ex-check{color:white;}
.ex-row.checked .ex-name{text-decoration:line-through;color:#6a6460;}
.ex-name{font-size:12px;font-weight:500;line-height:1.4;margin-bottom:2px;}
.ex-sets{font-size:10px;color:#6a6460;font-style:italic;}
.ex-forecast{font-size:9px;margin-top:3px;line-height:1.4;}
.weight-input{width:72px;background:#181818;border:1px solid #2a2a2a;color:#f0ede8;font-size:11px;padding:4px 7px;outline:none;text-align:right;}
.weight-input:focus{border-color:#1a6b8a;}

.meal-row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid #222;}
.meal-check{width:20px;height:20px;border:1.5px solid #b05a2a;border-radius:2px;background:none;color:transparent;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;cursor:pointer;transition:all .15s;}
.meal-row.checked .meal-check{background:#b05a2a;color:white;}
.meal-row.checked .meal-name-text{text-decoration:line-through;color:#6a6460;}
.meal-label{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:#d4784a;flex-shrink:0;}
.meal-name-text{font-size:12px;font-weight:500;}
.meal-detail{font-size:10px;color:#6a6460;margin-top:2px;line-height:1.5;}
.meal-cal{font-size:10px;color:#d4784a;flex-shrink:0;text-align:right;min-width:60px;}

.coach-note{margin-top:10px;padding:9px 11px;border-left:2px solid #c9a84c;background:rgba(201,168,76,0.05);font-size:11px;color:#6a6460;line-height:1.6;font-style:italic;}

.comments-textarea{width:100%;min-height:70px;background:#181818;border:1px solid #2a2a2a;color:#f0ede8;font-size:12px;line-height:1.6;padding:9px 11px;outline:none;resize:vertical;}
.comments-textarea:focus{border-color:#b05a2a;}

.complete-btn{width:100%;padding:11px;background:transparent;border-top:1px solid #2a2a2a;color:#6a6460;font-size:10px;letter-spacing:2px;text-transform:uppercase;transition:all .2s;}
.day-card.done .complete-btn{color:#2a8fb0;background:rgba(26,107,138,0.15);}

.guide-card{background:#111;border:1px solid #2a2a2a;padding:16px;margin-bottom:10px;}
.guide-title{font-size:17px;color:#2a8fb0;margin-bottom:8px;font-weight:700;}
.guide-body{font-size:12px;color:#6a6460;line-height:1.8;white-space:pre-line;}

.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.stat-box{background:#111;border:1px solid #2a2a2a;padding:16px;text-align:center;}
.stat-val{font-size:34px;color:#2a8fb0;line-height:1;font-weight:700;}
.stat-lbl{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#6a6460;margin-top:6px;}

footer{text-align:center;padding:24px 18px;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#3a3630;border-top:1px solid #2a2a2a;}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-badge">30 Day Program - v3</div>
  <div class="hero-title">STAY<span>SHARP</span></div>
  <div class="hero-sub">Mon-Fri Training . Weekend Rest . 5-6 Exercises . 50 Min Max</div>
</div>

<div class="progress-wrap">
  <div class="progress-row">
    <span class="progress-label">Overall Progress</span>
    <span class="progress-val" id="prog-val">0 / 30 Days</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
</div>

<div class="tabs" id="tabs"></div>
<div class="main" id="main"></div>
<footer>Stay Sharp v3 . 30 Days . Mon-Fri . Data saves in your browser</footer>

<script>
const DAY_TYPES={1:'run',2:'upper',3:'lower',4:'fullbody',5:'conditioning',6:'rest',7:'rest'};
const DAY_NAMES={run:'Monday - Run + Plyos',upper:'Tuesday - Upper Body',lower:'Wednesday - Lower Body',fullbody:'Thursday - Full Body',conditioning:'Friday - Conditioning',rest:'Weekend Rest'};
const DOWS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const TYPE_COLORS={run:'#2aaa6a',upper:'#2a8fb0',lower:'#3d9a68',fullbody:'#e8c97a',conditioning:'#d4784a',rest:'#6a6460'};

function getDayType(d){return DAY_TYPES[((d-1)%7)+1];}
function getWeek(d){return Math.ceil(d/7);}
function getDow(d){return ((d-1)%7);}

function getSets(week){
  const s=week<=2?2:3;
  const r={1:12,2:13,3:14,4:15}[week]||12;
  return s+'x'+r;
}

// Roman chair - 2 exercises only (no side bend)
const ROMAN=[
  {id:'rc_ext', name:'Roman Chair Back Extension',sets:'2x15 controlled',unit:'kg'},
  {id:'rc_hold',name:'Roman Chair Isometric Hold', sets:'2x20 sec',       unit:''},
];

// Back mobility - all 7, no side bend (side bend was already not in this list)
const BACK=[
  {id:'bm_hang',  name:'Dead Hang - bar',                    sets:'3x30 sec',  unit:''},
  {id:'bm_cc',    name:'Cat-Cow',                            sets:'10 slow',   unit:''},
  {id:'bm_kneeX', name:'Right Knee Cross-Body Pull',         sets:'60 sec',    unit:''},
  {id:'bm_sideR', name:'Side Bend Stretch - RIGHT side only',sets:'60 sec',    unit:''},
  {id:'bm_ttn',   name:'Thread the Needle - LEFT arm bias',  sets:'3x45 sec',  unit:''},
  {id:'bm_foam',  name:'Foam Roller Thoracic - left bias',   sets:'2 min',     unit:''},
  {id:'bm_breath',name:'Left Side Rib Breathing',            sets:'10 breaths',unit:''},
];

function getJaw(week){
  const p=week<=2?1:2;
  return [
    {id:'jaw_clench',name:'Jaw Clench Hold',                  sets:p===1?'4x20 sec':'5x25 sec'},
    {id:'jaw_tongue',name:'Tongue Press (full tongue to roof)',sets:p===1?'3x12 sec':'4x15 sec'},
    {id:'jaw_tuck',  name:'Chin Tuck',                        sets:p===1?'3x15':'4x15'},
    {id:'jaw_gum',   name:'Mastic/Hard Gum Chew',             sets:p===1?'15 min':'20 min'},
  ];
}

function getMeals(day){
  const type=getDayType(day);
  const hard=type!=='rest';
  const isRun=type==='run';
  return [
    {id:'coffee', label:'Morning',   name:'Black Coffee (1-2 cups)',
     detail:'Before training or with breakfast',cal:'~5 cal'},
    {id:'bfast',  label:'Breakfast', name:'Overnight Oats + Yogurt + Chia + Fruit',
     detail:'55g oats . 150g Greek yogurt . 12g chia seeds . 100g strawberries . 150g watermelon . 1 apple or orange . honey',
     cal:'~580 cal / 34g protein'},
    {id:'lunch',  label:'Lunch',     name:'Egg Fried Rice',
     detail:'3 eggs . 185g cooked rice . 100g frozen mixed veg . 15ml soy sauce . 5ml sesame oil . garlic . spring onion',
     cal:'~530 cal / 30g protein'},
    {id:'fruit2', label:'Snack',
     name:isRun?'Banana (run day)':hard?'Banana or Apple':'Skip if not hungry',
     detail:hard?'30-60 min before or after training':'Rest day - trust appetite',
     cal:hard?'~105 cal':'optional'},
    {id:'dinner', label:'Dinner',    name:'Steak or Pork Backstrap + Salad',
     detail:'180g raw steak or pork backstrap (= ~140-145g cooked) . 60g mixed leaves . 80g cucumber . 80g cherry tomatoes . 60g capsicum . 10ml olive oil . lemon'+(hard?' . 200g white or sweet potato + 5g butter':''),
     cal:hard?'~600-730 cal / 47-51g protein':'~400 cal / 43g protein'},
    {id:'water',  label:'Hydration', name:'3L Water',
     detail:'Spread through the day. Coffee does not count.',cal:'0 cal'},
  ];
}

function getWorkout(day){
  const week=getWeek(day);
  const type=getDayType(day);
  const s=getSets(week);

  const workouts={
    run:{
      title:DAY_NAMES.run,
      note:'Week '+week+': '+(week<=2?'25 min easy - first 5 min walk. Build the base.':week===3?'30 min - push the last 5 min hard.':'35 min or 5km. Track your time.')+' Keep rest under 60 sec between plyo sets.',
      ex:[
        ['run_main',week<=2?'25 min continuous run - easy pace':week===3?'30 min run - push last 5 min':'35 min run or 5km attempt','',''],
        ['run_burp','Burpees',(week<=2?'2':'3')+'x15',''],
        ['run_sqjmp','Squat Jump',(week<=2?'2':'3')+'x15',''],
        ['run_lat','Lateral Bound','2x15 each side',''],
        ['run_higknee','High Knees','2x30 sec',''],
      ]
    },
    upper:{
      title:DAY_NAMES.upper,
      note:'5 exercises, 45-60 sec rest between sets. Log weights every session - forecasts show your previous week target from Week 2 onwards.',
      ex:[
        ['up_bench','Barbell Bench Press',s,'kg'],
        ['up_ohp',  'Overhead Press - barbell',s,'kg'],
        ['up_row',  'Barbell Row',s,'kg'],
        ['up_pu',   'Weighted Pull-Up',s,'kg'],
        ['up_fp',   'Face Pull - cable rope',(week<=2?'2':'3')+'x15','kg'],
        ['up_plank','Plank - weighted','2x'+(week<=2?'40':'50')+' sec','kg'],
      ]
    },
    lower:{
      title:DAY_NAMES.lower,
      note:'Strong posterior chain protects your lower back. 45-60 sec rest between sets. Nordic curls - 4 seconds on the way down, slow and deliberate.',
      ex:[
        ['lo_squat','Barbell Back Squat',s,'kg'],
        ['lo_rdl',  'Romanian Deadlift',s,'kg'],
        ['lo_hipth','Hip Thrust - barbell',s,'kg'],
        ['lo_bss',  'Bulgarian Split Squat - DB',s+' each','kg'],
        ['lo_nord', 'Nordic Hamstring Curl','2x'+(week<=2?'8':'10')+' slow eccentric',''],
        ['lo_burp', 'Burpee','2x15',''],
      ]
    },
    fullbody:{
      title:DAY_NAMES.fullbody,
      note:'Superset pairs marked together - move straight from one to the other, rest 60 sec between pairs. Keeps time under 50 min.',
      ex:[
        ['fb_dead',  'Deadlift',s,'kg'],
        ['fb_purow', 'Pull-Up + DB Row superset',(week<=2?'2':'3')+'x('+(week<=2?'12':'14')+'+'+(week<=2?'12':'14')+')','kg'],
        ['fb_bench', 'DB Bench Press + Face Pull superset',(week<=2?'2':'3')+'x('+(week<=2?'12':'14')+'+15)','kg'],
        ['fb_kbswg', 'Kettlebell Swing',(week<=2?'2':'3')+'x15','kg'],
        ['fb_lunge', 'Walking Lunge - weighted',s+' each','kg'],
        ['fb_abwhl', 'Ab Wheel Rollout','2x'+(week<=2?'12':'15'),''],
      ]
    },
    conditioning:{
      title:DAY_NAMES.conditioning,
      note:'Row erg is your benchmark - track every time. Sprint intervals are 30 sec all-out, 30 sec rest. No half efforts. Finish strong.',
      ex:[
        ['cd_row',   week<=2?'Row Erg - 2000m (time it)':'Row Erg - 5x500m @ 90 sec rest','',''],
        ['cd_kbswg', 'Kettlebell Swing - heavy',(week<=2?'2':'3')+'x15','kg'],
        ['cd_burrow','Burpee + DB Row superset',(week<=2?'2':'3')+'x(12+12)','kg'],
        ['cd_sprint','Treadmill Sprint - 30 sec on/30 off',(week<=2?'8':'10')+' rounds',''],
        ['cd_sqjmp', 'Squat Jump',(week<=2?'2':'3')+'x15',''],
        ['cd_plank', 'Plank','2x'+(week<=2?'40':'50')+' sec',''],
      ]
    },
    rest:{
      title:DAY_NAMES.rest,
      note:'No gym, no Roman chair. Back mobility and jaw work still happen. Get a 30-40 min walk in. Eat to the plan.',
      ex:[
        ['rst_walk','30-40 min walk or easy swim','',''],
        ['rst_str', 'Full body stretch','15 min',''],
      ]
    },
  };
  return workouts[type]||workouts.rest;
}

// Storage
function load(){try{return JSON.parse(localStorage.getItem('ss_v3')||'{}')}catch(e){return{}}}
function save(s){try{localStorage.setItem('ss_v3',JSON.stringify(s))}catch(e){}}
let S=load();
if(!S.checked)S.checked={};
if(!S.weights)S.weights={};
if(!S.dayDone)S.dayDone={};
if(!S.comments)S.comments={};

// Forecast
function getForecast(exId,day,unit){
  if(unit!=='kg')return null;
  const prev=day-7;
  if(prev<1)return null;
  const prevVal=S.weights['d'+prev+'_'+exId];
  if(!prevVal||isNaN(parseFloat(prevVal)))return null;
  const p=parseFloat(prevVal);
  const curVal=S.weights['d'+day+'_'+exId];
  const c=curVal?parseFloat(curVal):null;
  if(c===null)return{text:'Last week: '+p+' kg - aim to beat this',color:'#c9a84c'};
  const diff=c-p;
  const next=(c+2.5).toFixed(1);
  const diffTxt=diff>0?'+'+diff.toFixed(1)+' kg on last week':diff<0?diff.toFixed(1)+' kg vs last week':'matched last week';
  return{text:diffTxt+' - Next week: '+next+' kg',color:diff>=0?'#3d9a68':'#d4784a'};
}

function exKey(day,id){return 'd'+day+'_'+id;}

function renderExRow(day,ex,accent,showForecast){
  var id=ex[0],name=ex[1],sets=ex[2],unit=ex[3];
  var key=exKey(day,id);
  var checked=!!S.checked[key];
  var weight=S.weights[key]||'';
  var forecast=showForecast?getForecast(id,day,unit):null;

  var div=document.createElement('div');
  div.className='ex-row'+(checked?' checked':'');
  div.id='er-'+key;

  var btn=document.createElement('button');
  btn.className='ex-check';
  btn.textContent='checkmark';
  btn.innerHTML='&#10003;';
  btn.style.borderColor=checked?accent:'#2a2a2a';
  btn.style.background=checked?accent:'none';
  btn.style.color=checked?'white':'transparent';
  btn.onclick=function(){
    S.checked[key]=!S.checked[key];save(S);
    var row=document.getElementById('er-'+key);
    if(row){
      row.classList.toggle('checked',S.checked[key]);
      btn.style.borderColor=S.checked[key]?accent:'#2a2a2a';
      btn.style.background=S.checked[key]?accent:'none';
      btn.style.color=S.checked[key]?'white':'transparent';
    }
  };
  div.appendChild(btn);

  var info=document.createElement('div');
  info.style.minWidth='0';
  var nm=document.createElement('div');
  nm.className='ex-name';
  nm.textContent=name;
  info.appendChild(nm);
  if(sets){
    var st=document.createElement('div');
    st.className='ex-sets';
    st.textContent=sets;
    info.appendChild(st);
  }
  if(showForecast&&unit==='kg'){
    var fc=document.createElement('div');
    fc.className='ex-forecast';
    fc.id='fc-'+key;
    if(forecast){fc.textContent=forecast.text;fc.style.color=forecast.color;}
    info.appendChild(fc);
  }
  div.appendChild(info);

  var right=document.createElement('div');
  if(unit==='kg'){
    var inp=document.createElement('input');
    inp.type='number';inp.step='0.5';inp.min='0';
    inp.className='weight-input';inp.placeholder='kg';inp.value=weight;
    inp.oninput=function(e){
      S.weights[key]=e.target.value;save(S);
      var fc=document.getElementById('fc-'+key);
      if(fc){var f=getForecast(id,day,unit);if(f){fc.textContent=f.text;fc.style.color=f.color;}else fc.textContent='';}
    };
    right.appendChild(inp);
  }
  div.appendChild(right);
  return div;
}

function renderMealRow(day,meal){
  var key=exKey(day,meal.id);
  var checked=!!S.checked[key];
  var div=document.createElement('div');
  div.className='meal-row'+(checked?' checked':'');
  div.id='mr-'+key;

  var btn=document.createElement('button');
  btn.className='meal-check';
  btn.innerHTML='&#10003;';
  if(checked){btn.style.background='#b05a2a';btn.style.color='white';}
  btn.onclick=function(){
    S.checked[key]=!S.checked[key];save(S);
    div.classList.toggle('checked',S.checked[key]);
    btn.style.background=S.checked[key]?'#b05a2a':'none';
    btn.style.color=S.checked[key]?'white':'transparent';
  };
  div.appendChild(btn);

  var info=document.createElement('div');
  info.style.cssText='flex:1;min-width:0';
  var topRow=document.createElement('div');
  topRow.style.cssText='display:flex;align-items:baseline;gap:8px;flex-wrap:wrap';
  var lbl=document.createElement('span');lbl.className='meal-label';lbl.textContent=meal.label;
  var mnm=document.createElement('span');mnm.className='meal-name-text';mnm.textContent=meal.name;
  topRow.appendChild(lbl);topRow.appendChild(mnm);
  var det=document.createElement('div');det.className='meal-detail';det.textContent=meal.detail;
  info.appendChild(topRow);info.appendChild(det);
  div.appendChild(info);

  var cal=document.createElement('div');
  cal.className='meal-cal';cal.textContent=meal.cal;
  div.appendChild(cal);
  return div;
}

function sectionLabel(text,color){
  var div=document.createElement('div');div.className='section-label';
  var span=document.createElement('span');span.textContent=text;span.style.color=color;
  div.appendChild(span);return div;
}

function coachNote(text,color,label){
  var div=document.createElement('div');div.className='coach-note';
  div.style.borderLeftColor=color||'#c9a84c';
  var strong=document.createElement('strong');
  strong.style.color=color||'#c9a84c';
  strong.style.fontStyle='normal';
  strong.style.fontSize='9px';
  strong.style.letterSpacing='1px';
  strong.style.textTransform='uppercase';
  strong.textContent=label||'Coach';
  var br=document.createElement('br');
  div.appendChild(strong);div.appendChild(br);
  div.appendChild(document.createTextNode(text));
  return div;
}

function buildDayCard(day){
  var w=getWorkout(day);
  var week=getWeek(day);
  var type=getDayType(day);
  var isRest=type==='rest';
  var isDone=!!S.dayDone[day];
  var color=TYPE_COLORS[type]||'#2a8fb0';
  var dow=getDow(day);
  var jaw=getJaw(week);
  var meals=getMeals(day);

  var card=document.createElement('div');
  card.className='day-card'+(isDone?' done':'');
  card.id='card-'+day;

  var hdr=document.createElement('div');
  hdr.className='day-header';
  hdr.onclick=function(){card.classList.toggle('open');};

  var numWrap=document.createElement('div');
  var numEl=document.createElement('div');
  numEl.className='day-num';
  numEl.style.color=isDone?'#2a8fb0':'#2a2a2a';
  numEl.textContent=String(day).padStart(2,'0');
  var dowEl=document.createElement('div');
  dowEl.className='day-dow';
  dowEl.textContent=DOWS[dow];
  numWrap.appendChild(numEl);numWrap.appendChild(dowEl);

  var titleWrap=document.createElement('div');
  titleWrap.style.cssText='flex:1;min-width:0';
  var titleEl=document.createElement('div');
  titleEl.className='day-title';titleEl.style.color=color;titleEl.textContent=w.title;
  var weekEl=document.createElement('div');
  weekEl.className='day-week';
  weekEl.textContent='Week '+week+' - '+(isRest?'Rest & Recover':type==='run'?'Cardio + Plyos':'Strength - 50 min max');
  titleWrap.appendChild(titleEl);titleWrap.appendChild(weekEl);

  var chevron=document.createElement('div');
  chevron.className='day-chevron';chevron.textContent='v';chevron.innerHTML='&#9660;';

  hdr.appendChild(numWrap);hdr.appendChild(titleWrap);hdr.appendChild(chevron);
  card.appendChild(hdr);

  var body=document.createElement('div');
  body.className='day-body';

  // Roman Chair - training days only
  if(!isRest){
    var rsec=document.createElement('div');rsec.className='section';
    rsec.appendChild(sectionLabel('Roman Chair Warm-Up','#e8c97a'));
    ROMAN.forEach(function(ex){rsec.appendChild(renderExRow(day,[ex.id,ex.name,ex.sets,ex.unit],'#c9a84c',false));});
    body.appendChild(rsec);
  }

  // Workout
  var wsec=document.createElement('div');wsec.className='section';
  wsec.appendChild(sectionLabel(isRest?'Active Recovery':'Workout',color));
  w.ex.forEach(function(ex){wsec.appendChild(renderExRow(day,ex,color,true));});
  wsec.appendChild(coachNote(w.note,color,'Coach'));
  body.appendChild(wsec);

  // Back mobility - every day
  var bsec=document.createElement('div');bsec.className='section';
  bsec.appendChild(sectionLabel('Back Mobility - S-Curve','#c4603a'));
  BACK.forEach(function(ex){bsec.appendChild(renderExRow(day,[ex.id,ex.name,ex.sets,ex.unit],'#7a3a2a',false));});
  bsec.appendChild(coachNote('Side bend RIGHT only - opens compressed left lumbar. Thread the needle LEFT arm - counteracts thoracic curve. Left rib breathing on exhale. Dead hang before and after every lifting session.','#7a3a2a','Back Note'));
  body.appendChild(bsec);

  // Jaw - every day
  var jsec=document.createElement('div');jsec.className='section';
  jsec.appendChild(sectionLabel('Jaw Program','#aa6abd'));
  jaw.forEach(function(ex){jsec.appendChild(renderExRow(day,[ex.id,ex.name,ex.sets,''],'#8b4a9c',false));});
  jsec.appendChild(coachNote('Mewing all day - tongue flat to roof of mouth. Week '+(week<=2?'1-2':'3-4')+' volume.','#8b4a9c','Jaw'));
  body.appendChild(jsec);

  // Meals
  var msec=document.createElement('div');msec.className='section';
  msec.appendChild(sectionLabel('Nutrition','#d4784a'));
  meals.forEach(function(m){msec.appendChild(renderMealRow(day,m));});
  var isHard=type!=='rest';
  msec.appendChild(coachNote(isHard?'Training day: include 200g potato + 5g butter at dinner and afternoon snack. ~1,900 cal total.':'Rest day: skip afternoon snack and dinner potato. ~1,600 cal total.','#b05a2a','Nutrition'));
  body.appendChild(msec);

  // Comments
  var csec=document.createElement('div');csec.className='section';
  csec.appendChild(sectionLabel('Notes & Comments','#6a6460'));
  var ta=document.createElement('textarea');
  ta.className='comments-textarea';
  ta.placeholder='How did it go? Weights hit, energy, anything for next session...';
  ta.value=S.comments[day]||'';
  ta.oninput=function(e){S.comments[day]=e.target.value;save(S);};
  csec.appendChild(ta);body.appendChild(csec);

  // Complete btn
  var doneBtn=document.createElement('button');
  doneBtn.className='complete-btn';
  doneBtn.id='done-'+day;
  doneBtn.textContent=isDone?'Complete - Day Done':'Mark Day Complete';
  doneBtn.onclick=function(){
    S.dayDone[day]=!S.dayDone[day];save(S);
    card.classList.toggle('done',S.dayDone[day]);
    doneBtn.textContent=S.dayDone[day]?'Complete - Day Done':'Mark Day Complete';
    numEl.style.color=S.dayDone[day]?'#2a8fb0':'#2a2a2a';
    updateProgress();buildTabs();
  };
  body.appendChild(doneBtn);
  card.appendChild(body);
  return card;
}

var WEEKS=[
  {label:'Week 1',days:[1,2,3,4,5,6,7],   desc:'Establish baseline weights. 2 sets x 12 reps. Log everything - seeds Week 2 forecasts.'},
  {label:'Week 2',days:[8,9,10,11,12,13,14],desc:'Targets auto-populate from Week 1. Beat every number. 2 sets x 13 reps.'},
  {label:'Week 3',days:[15,16,17,18,19,20,21],desc:'Sets increase to 3. Forecasts pull from Week 2 weights. 3 sets x 14 reps.'},
  {label:'Week 4',days:[22,23,24,25,26,27,28],desc:'Peak week. 3 sets x 15 reps. Full progression shows in every exercise.'},
  {label:'+ Days',days:[29,30],            desc:'Final 2 days. Finish strong.'},
];
var currentTab=0;

function buildTabs(){
  var container=document.getElementById('tabs');container.innerHTML='';
  var allTabs=WEEKS.concat([{label:'Guide',days:[]},{label:'Stats',days:[]}]);
  allTabs.forEach(function(w,i){
    var done=w.days?w.days.filter(function(d){return S.dayDone[d];}).length:0;
    var div=document.createElement('div');
    div.className='tab'+(currentTab===i?' active':'');
    div.textContent=w.label;
    if(done>0&&w.days&&w.days.length){
      var cnt=document.createElement('span');cnt.className='cnt';cnt.textContent=done+'/'+w.days.length;
      div.appendChild(cnt);
    }
    div.onclick=function(){currentTab=i;buildTabs();buildContent();};
    container.appendChild(div);
  });
}

function buildContent(){
  var main=document.getElementById('main');main.innerHTML='';
  if(currentTab<WEEKS.length){
    var wk=WEEKS[currentTab];
    var hdr=document.createElement('div');hdr.className='week-header';
    var wt=document.createElement('div');wt.className='week-title';wt.textContent='WEEK '+(currentTab+1);
    var wd=document.createElement('div');wd.className='week-desc';wd.textContent=wk.desc;
    hdr.appendChild(wt);hdr.appendChild(wd);
    main.appendChild(hdr);
    wk.days.forEach(function(day){main.appendChild(buildDayCard(day));});
  } else if(currentTab===WEEKS.length){
    buildGuide(main);
  } else {
    buildStats(main);
  }
}

function buildGuide(main){
  var hdr=document.createElement('div');hdr.className='week-header';
  var wt=document.createElement('div');wt.className='week-title';wt.style.color='#6a6460';wt.textContent='GUIDE';
  hdr.appendChild(wt);main.appendChild(hdr);

  var cards=[
    {title:'How Forecasting Works',color:'#2a8fb0',body:'When you log a weight the app saves it.\n\nNext week on the same exercise it shows: "Last week: X kg - aim to beat this" before you log anything.\n\nOnce you log this week it shows the difference and projects next week (+2.5 kg). Green = beat last week. Orange = dropped. No scrolling back through old sessions.'},
    {title:'Weekly Split - Mon to Fri',color:'#e8c97a',body:'Monday - Run + Plyos. 25-35 min run then plyos.\nTuesday - Upper Body. Bench, OHP, rows, pull-ups, face pulls, plank.\nWednesday - Lower Body. Squat, RDL, hip thrust, split squat, nordics, burpees.\nThursday - Full Body. Deadlift, supersets, KB swings, lunges, ab wheel.\nFriday - Conditioning. Row erg, KB swings, burpee rows, sprints.\nSaturday + Sunday - Rest. Back mobility and jaw still happen. No Roman chair.'},
    {title:'Rep Progression',color:'#3d9a68',body:'Week 1: 2 sets x 12 reps\nWeek 2: 2 sets x 13 reps\nWeek 3: 3 sets x 14 reps\nWeek 4: 3 sets x 15 reps\n\nProgressively overloading through both volume and reps. Combined with +2.5 kg weekly weight target you are increasing load AND reps across 4 weeks. Every session under 50 minutes.'},
    {title:'Roman Chair Notes',color:'#c9a84c',body:'Training days only - 2 exercises, takes under 6 minutes.\n\nBack Extension (2x15): Controlled movement, feel the erectors engage at the top. Do not hyperextend.\n\nIsometric Hold (2x20 sec): Hold at the top of the extension, brace the whole posterior chain.'},
    {title:'Back Mobility - S-Curve Specific',color:'#c4603a',body:'Every day including weekends.\n\nDead hang - decompresses the lumbar spine passively. Do before AND after lifting.\n\nSide bend RIGHT only - opens compressed left lumbar. Never stretch left side.\n\nThread the needle LEFT arm - rotates thoracic spine against your right thoracic curve.\n\nLeft rib breathing - lie on left side, breathe deep, let ribs sink on exhale. Clinical scoliosis management.'},
    {title:'Nutrition - Daily Structure',color:'#d4784a',body:'Breakfast: 55g oats + 150g yogurt + 12g chia + 100g strawberries + 150g watermelon + 1 apple or orange + honey + coffee (~580 cal / 34g protein)\n\nLunch: Egg fried rice - 3 eggs + 185g cooked rice + 100g frozen veg + soy + sesame + garlic (~530 cal / 30g protein)\n\nSnack: 1 banana on training days. Skip on rest days.\n\nDinner: 180g raw steak or pork backstrap + large salad + 200g potato + 5g butter on training days (~600-730 cal / 47-51g protein)\n\nTraining days: ~1,900 cal\nRest days: ~1,600 cal\n\nTaco bowl swap: 150g raw pork mince + El Toro seasoning + 185g cooked rice + 30g cheese + 1 flour tortilla (~620 cal / 38g protein)'},
  ];

  cards.forEach(function(c){
    var card=document.createElement('div');card.className='guide-card';
    var gt=document.createElement('div');gt.className='guide-title';gt.style.color=c.color;gt.textContent=c.title;
    var gb=document.createElement('div');gb.className='guide-body';gb.textContent=c.body;
    card.appendChild(gt);card.appendChild(gb);
    main.appendChild(card);
  });
}

function buildStats(main){
  var done=Object.values(S.dayDone).filter(Boolean).length;
  var exChecked=Object.values(S.checked).filter(Boolean).length;
  var weights=S.weights||{};
  function heaviest(kw){
    var vals=Object.entries(weights).filter(function(e){return e[0].includes(kw);}).map(function(e){return parseFloat(e[1])||0;});
    return vals.length?Math.max.apply(null,vals):null;
  }
  var dl=heaviest('dead');var bench=heaviest('bench');var squat=heaviest('squat');

  var hdr=document.createElement('div');hdr.className='week-header';
  var wt=document.createElement('div');wt.className='week-title';wt.style.color='#6a6460';wt.textContent='YOUR STATS';
  hdr.appendChild(wt);main.appendChild(hdr);

  var grid=document.createElement('div');grid.className='stats-grid';
  [{v:done,l:'Days Complete'},{v:30-done,l:'Days Remaining'},{v:exChecked,l:'Exercises Logged'},{v:Math.round((done/30)*100)+'%',l:'Complete'}]
    .forEach(function(s){
      var box=document.createElement('div');box.className='stat-box';
      var sv=document.createElement('div');sv.className='stat-val';sv.textContent=s.v;
      var sl=document.createElement('div');sl.className='stat-lbl';sl.textContent=s.l;
      box.appendChild(sv);box.appendChild(sl);grid.appendChild(box);
    });
  main.appendChild(grid);

  if(dl||bench||squat){
    var grid2=document.createElement('div');grid2.className='stats-grid';
    grid2.style.gridTemplateColumns='1fr 1fr 1fr';
    [[dl,'Best Deadlift'],[bench,'Best Bench'],[squat,'Best Squat']].filter(function(x){return x[0];}).forEach(function(x){
      var box=document.createElement('div');box.className='stat-box';
      var sv=document.createElement('div');sv.className='stat-val';sv.textContent=x[0]+'kg';
      var sl=document.createElement('div');sl.className='stat-lbl';sl.textContent=x[1];
      box.appendChild(sv);box.appendChild(sl);grid2.appendChild(box);
    });
    main.appendChild(grid2);
  }

  var card=document.createElement('div');card.className='guide-card';
  var gt=document.createElement('div');gt.className='guide-title';gt.textContent='Week-on-Week Tracking';
  var gb=document.createElement('div');gb.className='guide-body';gb.textContent='Every kg exercise shows last weeks weight as your target when you open a new week. After you log this week it shows your improvement and projects next week automatically.';
  card.appendChild(gt);card.appendChild(gb);main.appendChild(card);
}

function updateProgress(){
  var done=Object.values(S.dayDone).filter(Boolean).length;
  document.getElementById('prog-val').textContent=done+' / 30 Days';
  document.getElementById('prog-fill').style.width=(done/30*100)+'%';
}

buildTabs();buildContent();updateProgress();
</script>
</body>
</html>
