<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stay Sharp v2 — 30 Day Program</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{background:#080808;color:#f0ede8;font-family:-apple-system,system-ui,sans-serif;font-size:14px;min-height:100vh;}
button{font-family:inherit;cursor:pointer;border:none;}
input,textarea{font-family:inherit;}
textarea{-webkit-appearance:none;border-radius:0;}

.hero{padding:36px 18px 24px;text-align:center;border-bottom:1px solid #2a2a2a;background:linear-gradient(180deg,#111 0%,#080808 100%);}
.hero-badge{display:inline-block;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:#c9a84c;border:1px solid rgba(201,168,76,0.35);padding:5px 13px;margin-bottom:14px;}
.hero-title{font-size:clamp(44px,12vw,72px);line-height:0.9;letter-spacing:1px;margin-bottom:4px;font-weight:700;}
.hero-title span{color:#2a8fb0;}
.hero-sub{font-size:11px;color:#6a6460;margin-top:12px;line-height:1.6;}

.progress-wrap{padding:14px 18px 0;max-width:860px;margin:0 auto;}
.progress-row{display:flex;justify-content:space-between;margin-bottom:7px;}
.progress-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#6a6460;}
.progress-val{font-size:18px;color:#c9a84c;font-weight:700;}
.progress-bar{height:3px;background:#2a2a2a;border-radius:2px;overflow:hidden;margin-bottom:14px;}
.progress-fill{height:100%;background:linear-gradient(90deg,#1a6b8a,#c9a84c);transition:width .5s;}

.tabs{display:flex;overflow-x:auto;border-bottom:1px solid #2a2a2a;background:#111;position:sticky;top:0;z-index:50;-webkit-overflow-scrolling:touch;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:0 0 auto;padding:11px 14px;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#6a6460;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:all .2s;}
.tab.active{color:#2a8fb0;border-bottom-color:#2a8fb0;}
.tab .cnt{margin-left:4px;font-size:9px;color:#c9a84c;}

.main{max-width:860px;margin:0 auto;padding:18px;}
.week-header{margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #2a2a2a;}
.week-title{font-size:26px;color:#2a8fb0;letter-spacing:1px;font-weight:700;}
.week-desc{font-size:11px;color:#6a6460;margin-top:4px;}

.day-card{background:#111;border:1px solid #2a2a2a;margin-bottom:8px;}
.day-card.done{border-color:rgba(26,107,138,0.4);}
.day-header{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer;}
.day-num{font-size:22px;color:#2a2a2a;font-weight:700;min-width:32px;line-height:1;}
.day-card.done .day-num{color:#2a8fb0;}
.day-dow{font-size:9px;color:#6a6460;letter-spacing:1px;text-transform:uppercase;margin-top:2px;}
.day-title{font-size:13px;font-weight:500;margin-bottom:4px;}
.day-week{font-size:9px;color:#6a6460;}
.day-chevron{font-size:11px;color:#6a6460;transition:transform .2s;flex-shrink:0;margin-left:auto;}
.day-card.open .day-chevron{transform:rotate(180deg);}
.day-body{display:none;border-top:1px solid #2a2a2a;}
.day-card.open .day-body{display:block;}

.section{padding:14px;border-bottom:1px solid #222;}
.section-label{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.section-label span{font-size:9px;letter-spacing:2px;text-transform:uppercase;flex-shrink:0;}
.section-label::after{content:'';flex:1;height:1px;background:#2a2a2a;}

.ex-row{display:grid;grid-template-columns:22px 1fr auto;gap:10px;padding:8px 0;border-bottom:1px solid #222;align-items:start;}
.ex-row:last-of-type{border-bottom:none;}
.ex-check{width:20px;height:20px;border:1.5px solid #2a2a2a;border-radius:2px;background:none;color:transparent;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;transition:all .15s;cursor:pointer;}
.ex-row.checked .ex-check{color:white;}
.ex-row.checked .ex-name{text-decoration:line-through;color:#6a6460;}
.ex-name{font-size:12px;font-weight:500;line-height:1.4;margin-bottom:2px;}
.ex-sets{font-size:10px;color:#6a6460;font-style:italic;}
.ex-forecast{font-size:9px;margin-top:3px;line-height:1.4;}
.weight-input{width:72px;background:#181818;border:1px solid #2a2a2a;color:#f0ede8;font-size:11px;padding:4px 7px;outline:none;text-align:right;}
.weight-input:focus{border-color:#1a6b8a;}

.meal-row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid #222;}
.meal-check{width:20px;height:20px;border:1.5px solid #b05a2a;border-radius:2px;background:none;color:transparent;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;cursor:pointer;transition:all .15s;}
.meal-row.checked .meal-check{background:#b05a2a;color:white;}
.meal-row.checked .meal-name-text{text-decoration:line-through;color:#6a6460;}
.meal-label{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:#d4784a;flex-shrink:0;}
.meal-name-text{font-size:12px;font-weight:500;}
.meal-detail{font-size:10px;color:#6a6460;margin-top:2px;line-height:1.5;}
.meal-cal{font-size:10px;color:#d4784a;flex-shrink:0;text-align:right;min-width:60px;}

.coach-note{margin-top:10px;padding:9px 11px;border-left:2px solid #c9a84c;background:rgba(201,168,76,0.05);font-size:11px;color:#6a6460;line-height:1.6;font-style:italic;}
.coach-note strong{font-style:normal;font-size:9px;letter-spacing:1px;text-transform:uppercase;}

.comments-textarea{width:100%;min-height:70px;background:#181818;border:1px solid #2a2a2a;color:#f0ede8;font-size:12px;line-height:1.6;padding:9px 11px;outline:none;resize:vertical;}
.comments-textarea:focus{border-color:#b05a2a;}

.complete-btn{width:100%;padding:11px;background:transparent;border-top:1px solid #2a2a2a;color:#6a6460;font-size:10px;letter-spacing:2px;text-transform:uppercase;transition:all .2s;}
.day-card.done .complete-btn{color:#2a8fb0;background:rgba(26,107,138,0.15);}

.guide-card{background:#111;border:1px solid #2a2a2a;padding:16px;margin-bottom:10px;}
.guide-title{font-size:17px;color:#2a8fb0;margin-bottom:8px;font-weight:700;}
.guide-body{font-size:12px;color:#6a6460;line-height:1.8;white-space:pre-line;}

.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.stat-box{background:#111;border:1px solid #2a2a2a;padding:16px;text-align:center;}
.stat-val{font-size:34px;color:#2a8fb0;line-height:1;font-weight:700;}
.stat-lbl{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#6a6460;margin-top:6px;}

footer{text-align:center;padding:24px 18px;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#3a3630;border-top:1px solid #2a2a2a;}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-badge">30 Day Program — v2</div>
  <div class="hero-title">STAY<span>SHARP</span></div>
  <div class="hero-sub">Mon–Fri Training · Weekend Rest · 50 Min Sessions · Week-on-Week Forecasting</div>
</div>

<div class="progress-wrap">
  <div class="progress-row">
    <span class="progress-label">Overall Progress</span>
    <span class="progress-val" id="prog-val">0 / 30 Days</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
</div>

<div class="tabs" id="tabs"></div>
<div class="main" id="main"></div>
<footer>Stay Sharp v2 · 30 Days · Mon–Fri · Data saves in your browser</footer>

<script>
// ── DAY TYPES: Mon=run, Tue=upper, Wed=lower, Thu=fullbody, Fri=conditioning, Sat=rest, Sun=rest
const DAY_TYPES={1:'run',2:'upper',3:'lower',4:'fullbody',5:'conditioning',6:'rest',7:'rest'};
const DAY_NAMES={
  run:'Monday — Run + Plyos',
  upper:'Tuesday — Upper Body',
  lower:'Wednesday — Lower Body',
  fullbody:'Thursday — Full Body',
  conditioning:'Friday — Conditioning',
  rest:'Weekend Rest'
};
const DOWS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const TYPE_COLORS={run:'#2aaa6a',upper:'#2a8fb0',lower:'#3d9a68',fullbody:'#e8c97a',conditioning:'#d4784a',rest:'#6a6460'};

function getDayType(d){return DAY_TYPES[((d-1)%7)+1];}
function getWeek(d){return Math.ceil(d/7);}
function getDow(d){return ((d-1)%7);}

// ── SETS/REPS: 2-3 sets, reps 12→13→14→15 across weeks ──────────────────────
function getSets(week){
  const s = week<=2 ? 2 : 3;
  const r = {1:12,2:13,3:14,4:15}[week]||12;
  return `${s}×${r}`;
}

// ── ROMAN CHAIR WARMUP ────────────────────────────────────────────────────────
const ROMAN=[
  {id:'rc_ext', name:'Roman Chair Back Extension', sets:'2×15 controlled', unit:'kg'},
  {id:'rc_side',name:'Roman Chair Side Bend',       sets:'2×12 each side',  unit:'kg'},
  {id:'rc_hold',name:'Roman Chair Isometric Hold',  sets:'2×20 sec',        unit:''},
];

// ── BACK MOBILITY ─────────────────────────────────────────────────────────────
const BACK=[
  {id:'bm_hang',  name:'Dead Hang — bar',                    sets:'3×30 sec', unit:''},
  {id:'bm_cc',    name:'Cat-Cow',                            sets:'10 slow',  unit:''},
  {id:'bm_kneeX', name:'Right Knee Cross-Body Pull',         sets:'60 sec',   unit:''},
  {id:'bm_sideR', name:'Side Bend Stretch — RIGHT side only',sets:'60 sec',   unit:''},
  {id:'bm_ttn',   name:'Thread the Needle — LEFT arm bias',  sets:'3×45 sec', unit:''},
  {id:'bm_foam',  name:'Foam Roller Thoracic — left bias',   sets:'2 min',    unit:''},
  {id:'bm_breath',name:'Left Side Rib Breathing',            sets:'10 breaths',unit:''},
];

// ── JAW ───────────────────────────────────────────────────────────────────────
function getJaw(week){
  const p=week<=2?1:2;
  return [
    {id:'jaw_clench',name:'Jaw Clench Hold',                  sets:p===1?'4×20 sec':'5×25 sec'},
    {id:'jaw_tongue',name:'Tongue Press (full tongue to roof)',sets:p===1?'3×12 sec':'4×15 sec'},
    {id:'jaw_tuck',  name:'Chin Tuck',                        sets:p===1?'3×15':'4×15'},
    {id:'jaw_gum',   name:'Mastic/Hard Gum Chew',             sets:p===1?'15 min':'20 min'},
  ];
}

// ── MEALS ─────────────────────────────────────────────────────────────────────
function getMeals(day){
  const type=getDayType(day);
  const hard=type!=='rest';
  const isRun=type==='run';
  return [
    {id:'coffee', label:'Morning',   name:'Black Coffee (1–2 cups)',
     detail:'Before training or with breakfast',cal:'~5 cal'},

    {id:'bfast',  label:'Breakfast', name:'Overnight Oats + Yogurt + Chia + Fresh Fruit',
     detail:'55g rolled oats · 150g Greek yogurt · 12g chia seeds · 100g strawberries · 150g watermelon · 1 apple or orange · drizzle honey',
     cal:'~580 cal / 34g protein'},

    {id:'lunch',  label:'Lunch',     name:'Egg Fried Rice',
     detail:'3 eggs · 185g cooked rice · 100g frozen mixed veg · 15ml soy sauce · 5ml sesame oil · garlic · spring onion',
     cal:'~530 cal / 30g protein'},

    {id:'fruit2', label:'Snack',
     name: isRun ? 'Banana (training day)' : hard ? 'Banana or Apple' : 'Skip if not hungry',
     detail: hard ? 'Best eaten 30–60 min before or after training' : 'Rest day — trust appetite',
     cal: hard?'~105–120 cal':'optional'},

    {id:'dinner', label:'Dinner',    name:'Steak + Green Salad',
     detail:`180g raw steak (= ~145g cooked) · 60g mixed leaves · 80g cucumber · 80g cherry tomatoes · 60g capsicum · 20g red onion · 10ml olive oil · lemon${hard?' · 200g white or sweet potato (training days)':''}`,
     cal: hard?'~560–720 cal / 47–51g protein':'~400 cal / 43g protein'},

    {id:'water',  label:'Hydration', name:'3L Water',
     detail:"Spread through the day. Coffee doesn't count.",cal:'0 cal'},
  ];
}

// ── WORKOUTS ──────────────────────────────────────────────────────────────────
function getWorkout(day){
  const week=getWeek(day);
  const type=getDayType(day);
  const s=getSets(week);

  const workouts={
    run:{
      title:DAY_NAMES.run,
      note:`Week ${week}: ${week<=2?'25 min easy run — build the base. First 5 min walk.':week===3?'30 min run — push the last 5 min hard.':'35 min run or aim for 5km. Track your time.'} Follow with plyos — keep rest under 60 sec between sets.`,
      ex:[
        ['run_main', week<=2?'25 min continuous run — easy pace':week===3?'30 min run — push last 5 min':'35 min run or 5km attempt','',''],
        ['run_cool','Cool-down walk','5 min',''],
        ['run_burp','Burpees',`${week<=2?'2':'3'}×15`,''],
        ['run_sqjmp','Squat Jump',`${week<=2?'2':'3'}×15`,''],
        ['run_lat','Lateral Bound','2×15 each side',''],
        ['run_higknee','High Knees',`2×30 sec`,''],
      ]
    },
    upper:{
      title:DAY_NAMES.upper,
      note:'Upper body in 50 min: 2–3 sets, 12–15 reps, 45–60 sec rest between sets. Log weights every session — projections show your previous week target automatically from Week 2.',
      ex:[
        ['up_bench', 'Barbell Bench Press',      s,'kg'],
        ['up_ohp',   'Overhead Press — barbell', s,'kg'],
        ['up_row',   'Barbell Row',               s,'kg'],
        ['up_pu',    'Weighted Pull-Up',          s,'kg'],
        ['up_fly',   'Cable Chest Fly',           s,'kg'],
        ['up_fp',    'Face Pull — cable rope',    `${week<=2?'2':'3'}×15`,'kg'],
        ['up_er',    'Band External Rotation',    '2×20 each',''],
        ['up_tri',   'Tricep Rope Pushdown',      s,'kg'],
        ['up_curl',  'Incline DB Curl',           s,'kg'],
        ['up_plank', 'Plank — weighted',          `2×${week<=2?'40':'50'} sec`,'kg'],
      ]
    },
    lower:{
      title:DAY_NAMES.lower,
      note:'Strong posterior chain protects your lower back and drives power. 45–60 sec rest between sets. Nordic curls are slow and deliberate — 4 seconds on the way down.',
      ex:[
        ['lo_squat','Barbell Back Squat',        s,'kg'],
        ['lo_rdl',  'Romanian Deadlift',         s,'kg'],
        ['lo_hipth','Hip Thrust — barbell',      s,'kg'],
        ['lo_bss',  'Bulgarian Split Squat — DB',s+' each','kg'],
        ['lo_legcl','Leg Curl — machine',        s,'kg'],
        ['lo_legex','Leg Extension — machine',   s,'kg'],
        ['lo_calf', 'Calf Raise — standing',     `${week<=2?'2':'3'}×20`,'kg'],
        ['lo_nord', 'Nordic Hamstring Curl',      `2×${week<=2?'8':'10'} slow eccentric`,''],
        ['lo_burp', 'Burpee',                     `2×15`,''],
        ['lo_boxj', 'Box Jump',                   `2×${week<=2?'8':'10'}`,''],
      ]
    },
    fullbody:{
      title:DAY_NAMES.fullbody,
      note:'Superset where marked — pair the two exercises, rest 60 sec between pairs. Keeps time under 50 min while maintaining intensity and calorie burn.',
      ex:[
        ['fb_dead',  'Deadlift',                              s,'kg'],
        ['fb_purow', 'Pull-Up + DB Row superset',             `${week<=2?'2':'3'}×(${week<=2?'12':'14'}+${week<=2?'12':'14'})`,'kg'],
        ['fb_bench', 'DB Bench Press + Face Pull superset',   `${week<=2?'2':'3'}×(${week<=2?'12':'14'}+15)`,'kg'],
        ['fb_kbswg', 'Kettlebell Swing',                      `${week<=2?'2':'3'}×15`,'kg'],
        ['fb_lunge', 'Walking Lunge — weighted',              s+' each','kg'],
        ['fb_pallof','Pallof Press — cable',                  '2×15 each','kg'],
        ['fb_burpbj','Burpee to Box Jump',                    `2×${week<=2?'10':'12'}`,''],
        ['fb_abwhl', 'Ab Wheel Rollout',                      `2×${week<=2?'12':'15'}`,''],
      ]
    },
    conditioning:{
      title:DAY_NAMES.conditioning,
      note:'Friday finish — high intensity, short rest. Row erg is your benchmark: track every time. Sprint intervals are 30 sec all-out, 30 sec rest. No half efforts.',
      ex:[
        ['cd_row',   week<=2?'Row Erg — 2000m (time it)':'Row Erg — 5×500m @ 90 sec rest','',''],
        ['cd_burrow','Burpee + DB Row superset',             `${week<=2?'2':'3'}×(12+12)`,'kg'],
        ['cd_sqjmp', 'Squat Jump',                           `${week<=2?'2':'3'}×15`,''],
        ['cd_kbswg', 'Kettlebell Swing — heavy',             `${week<=2?'2':'3'}×15`,'kg'],
        ['cd_sprint','Treadmill Sprint — 30 sec on/30 off',  `${week<=2?'8':'10'} rounds`,''],
        ['cd_latbnd','Lateral Bound',                        '2×15 each',''],
        ['cd_plank', 'Plank',                                `2×${week<=2?'40':'50'} sec`,''],
      ]
    },
    rest:{
      title:DAY_NAMES.rest,
      note:'Weekend off the gym. Back mobility and jaw work still happen. Get a 30–40 min walk in. Eat to the plan.',
      ex:[
        ['rst_walk','30–40 min walk or easy swim','',''],
        ['rst_str', 'Full body stretch','15 min',''],
      ]
    },
  };
  return workouts[type]||workouts.rest;
}

// ── STORAGE ───────────────────────────────────────────────────────────────────
function load(){try{return JSON.parse(localStorage.getItem('ss_v2')||'{}')}catch(e){return{}}}
function save(s){try{localStorage.setItem('ss_v2',JSON.stringify(s))}catch(e){}}
let S=load();
if(!S.checked)S.checked={};
if(!S.weights)S.weights={};
if(!S.dayDone)S.dayDone={};
if(!S.comments)S.comments={};

// ── FORECAST ──────────────────────────────────────────────────────────────────
function getForecast(exId,day,unit){
  if(unit!=='kg')return null;
  const prev=day-7;
  if(prev<1)return null;
  const prevVal=S.weights[`d${prev}_${exId}`];
  if(!prevVal||isNaN(parseFloat(prevVal)))return null;
  const p=parseFloat(prevVal);
  const curVal=S.weights[`d${day}_${exId}`];
  const c=curVal?parseFloat(curVal):null;
  if(c===null)return{text:`Last week: ${p} kg — aim to beat this`,color:'#c9a84c'};
  const diff=c-p;
  const next=(c+2.5).toFixed(1);
  const diffTxt=diff>0?`+${diff.toFixed(1)} kg on last week`:diff<0?`${diff.toFixed(1)} kg vs last week`:'matched last week';
  return{text:`${diffTxt} · Next week → ${next} kg`,color:diff>=0?'#3d9a68':'#d4784a'};
}

// ── RENDER HELPERS ────────────────────────────────────────────────────────────
function exKey(day,id){return `d${day}_${id}`;}

function renderExRow(day,ex,accent,showForecast){
  const[id,name,sets,unit]=ex;
  const key=exKey(day,id);
  const checked=!!S.checked[key];
  const weight=S.weights[key]||'';
  const forecast=showForecast?getForecast(id,day,unit):null;

  const div=document.createElement('div');
  div.className='ex-row'+(checked?' checked':'');
  div.id=`er-${key}`;

  const btn=document.createElement('button');
  btn.className='ex-check';
  btn.textContent='✓';
  btn.style.borderColor=checked?accent:'#2a2a2a';
  btn.style.background=checked?accent:'none';
  btn.style.color=checked?'white':'transparent';
  btn.onclick=()=>{
    S.checked[key]=!S.checked[key];save(S);
    const row=document.getElementById(`er-${key}`);
    if(row){
      row.classList.toggle('checked',S.checked[key]);
      btn.style.borderColor=S.checked[key]?accent:'#2a2a2a';
      btn.style.background=S.checked[key]?accent:'none';
      btn.style.color=S.checked[key]?'white':'transparent';
    }
  };
  div.appendChild(btn);

  const info=document.createElement('div');
  info.style.minWidth='0';
  const nm=document.createElement('div');
  nm.className='ex-name';
  nm.textContent=name;
  info.appendChild(nm);
  if(sets){const st=document.createElement('div');st.className='ex-sets';st.textContent=sets;info.appendChild(st);}
  if(showForecast&&unit==='kg'){
    const fc=document.createElement('div');
    fc.className='ex-forecast';
    fc.id=`fc-${key}`;
    if(forecast){fc.textContent=forecast.text;fc.style.color=forecast.color;}
    info.appendChild(fc);
  }
  div.appendChild(info);

  const right=document.createElement('div');
  if(unit==='kg'){
    const inp=document.createElement('input');
    inp.type='number';inp.step='0.5';inp.min='0';
    inp.className='weight-input';inp.placeholder='kg';inp.value=weight;
    inp.oninput=e=>{
      S.weights[key]=e.target.value;save(S);
      const fc=document.getElementById(`fc-${key}`);
      if(fc){const f=getForecast(id,day,unit);if(f){fc.textContent=f.text;fc.style.color=f.color;}else fc.textContent='';}
    };
    right.appendChild(inp);
  }
  div.appendChild(right);
  return div;
}

function renderMealRow(day,meal){
  const key=exKey(day,meal.id);
  const checked=!!S.checked[key];
  const div=document.createElement('div');
  div.className='meal-row'+(checked?' checked':'');
  div.id=`mr-${key}`;

  const btn=document.createElement('button');
  btn.className='meal-check';
  btn.textContent='✓';
  if(checked){btn.style.background='#b05a2a';btn.style.color='white';}
  btn.onclick=()=>{
    S.checked[key]=!S.checked[key];save(S);
    div.classList.toggle('checked',S.checked[key]);
    btn.style.background=S.checked[key]?'#b05a2a':'none';
    btn.style.color=S.checked[key]?'white':'transparent';
  };
  div.appendChild(btn);

  const info=document.createElement('div');
  info.style.cssText='flex:1;min-width:0';
  info.innerHTML=`<div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap"><span class="meal-label">${meal.label}</span><span class="meal-name-text">${meal.name}</span></div><div class="meal-detail">${meal.detail}</div>`;
  div.appendChild(info);

  const cal=document.createElement('div');
  cal.className='meal-cal';cal.textContent=meal.cal;
  div.appendChild(cal);
  return div;
}

function sectionLabel(text,color){
  const div=document.createElement('div');div.className='section-label';
  const span=document.createElement('span');span.textContent=text;span.style.color=color;
  div.appendChild(span);return div;
}

function coachNote(text,color){
  const div=document.createElement('div');div.className='coach-note';
  div.style.borderLeftColor=color||'#c9a84c';
  div.innerHTML=`<strong style="color:${color||'#c9a84c'}">Coach</strong><br>${text}`;
  return div;
}

// ── BUILD DAY CARD ────────────────────────────────────────────────────────────
function buildDayCard(day){
  const w=getWorkout(day);
  const week=getWeek(day);
  const type=getDayType(day);
  const isRest=type==='rest';
  const isDone=!!S.dayDone[day];
  const color=TYPE_COLORS[type]||'#2a8fb0';
  const dow=getDow(day);
  const jaw=getJaw(week);
  const meals=getMeals(day);

  const card=document.createElement('div');
  card.className='day-card'+(isDone?' done':'');
  card.id=`card-${day}`;

  const hdr=document.createElement('div');
  hdr.className='day-header';
  hdr.onclick=()=>card.classList.toggle('open');
  hdr.innerHTML=`
    <div>
      <div class="day-num" style="color:${isDone?'#2a8fb0':'#2a2a2a'}">${String(day).padStart(2,'0')}</div>
      <div class="day-dow">${DOWS[dow]}</div>
    </div>
    <div style="flex:1;min-width:0">
      <div class="day-title" style="color:${color}">${w.title}</div>
      <div class="day-week">Week ${week} · ${isRest?'Rest & Recover':type==='run'?'Cardio + Plyos':'Strength — 50 min max'}</div>
    </div>
    <div class="day-chevron">▼</div>`;
  card.appendChild(hdr);

  const body=document.createElement('div');
  body.className='day-body';

  // Roman Chair (non-rest)
  if(!isRest){
    const sec=document.createElement('div');sec.className='section';
    sec.appendChild(sectionLabel('Roman Chair Warm-Up','#e8c97a'));
    ROMAN.forEach(ex=>sec.appendChild(renderExRow(day,[ex.id,ex.name,ex.sets,ex.unit],'#c9a84c',false)));
    body.appendChild(sec);
  }

  // Workout
  const wsec=document.createElement('div');wsec.className='section';
  wsec.appendChild(sectionLabel(isRest?'Active Recovery':'Workout',color));
  w.ex.forEach(ex=>wsec.appendChild(renderExRow(day,ex,color,true)));
  wsec.appendChild(coachNote(w.note,color));
  body.appendChild(wsec);

  // Back mobility
  const bsec=document.createElement('div');bsec.className='section';
  bsec.appendChild(sectionLabel('Back Mobility — S-Curve','#c4603a'));
  BACK.forEach(ex=>bsec.appendChild(renderExRow(day,[ex.id,ex.name,ex.sets,ex.unit],'#7a3a2a',false)));
  const bnote=document.createElement('div');bnote.className='coach-note';
  bnote.style.borderLeftColor='#7a3a2a';
  bnote.innerHTML='<strong style="color:#c4603a">Back Note</strong><br>Side bend RIGHT only — opens compressed left lumbar. Thread the needle LEFT arm — counteracts thoracic curve. Left rib breathing on exhale. Dead hang before and after every lifting session.';
  bsec.appendChild(bnote);body.appendChild(bsec);

  // Jaw
  const jsec=document.createElement('div');jsec.className='section';
  jsec.appendChild(sectionLabel('Jaw Program','#aa6abd'));
  jaw.forEach(ex=>jsec.appendChild(renderExRow(day,[ex.id,ex.name,ex.sets,''],'#8b4a9c',false)));
  const jnote=document.createElement('div');jnote.className='coach-note';
  jnote.style.borderLeftColor='#8b4a9c';
  jnote.innerHTML=`<strong style="color:#aa6abd">Jaw</strong><br>Mewing all day — tongue flat to roof of mouth. Week ${week<=2?'1–2':'3–4'} volume.`;
  jsec.appendChild(jnote);body.appendChild(jsec);

  // Meals
  const msec=document.createElement('div');msec.className='section';
  msec.appendChild(sectionLabel('Nutrition','#d4784a'));
  meals.forEach(m=>msec.appendChild(renderMealRow(day,m)));
  const mnote=document.createElement('div');mnote.className='coach-note';
  mnote.style.borderLeftColor='#b05a2a';
  const isHard=type!=='rest';
  mnote.innerHTML=`<strong style="color:#d4784a">Nutrition</strong><br>${isHard?'Training day: include the 200g potato at dinner and the afternoon snack. ~1,880 cal total.':'Rest day: skip afternoon snack and dinner potato. ~1,600 cal total.'}`;
  msec.appendChild(mnote);body.appendChild(msec);

  // Comments
  const csec=document.createElement('div');csec.className='section';
  csec.appendChild(sectionLabel('Notes & Comments','#6a6460'));
  const ta=document.createElement('textarea');
  ta.className='comments-textarea';
  ta.placeholder='How did it go? Weights hit, energy, anything for next session...';
  ta.value=S.comments[day]||'';
  ta.oninput=e=>{S.comments[day]=e.target.value;save(S);};
  csec.appendChild(ta);body.appendChild(csec);

  // Complete
  const doneBtn=document.createElement('button');
  doneBtn.className='complete-btn';
  doneBtn.id=`done-${day}`;
  doneBtn.textContent=isDone?'✓ Day Complete':'Mark Day Complete';
  doneBtn.onclick=()=>{
    S.dayDone[day]=!S.dayDone[day];save(S);
    card.classList.toggle('done',S.dayDone[day]);
    doneBtn.textContent=S.dayDone[day]?'✓ Day Complete':'Mark Day Complete';
    const num=card.querySelector('.day-num');
    if(num)num.style.color=S.dayDone[day]?'#2a8fb0':'#2a2a2a';
    updateProgress();buildTabs();
  };
  body.appendChild(doneBtn);
  card.appendChild(body);
  return card;
}

// ── WEEKS ─────────────────────────────────────────────────────────────────────
const WEEKS=[
  {label:'Week 1',days:[1,2,3,4,5,6,7],   desc:'Establish baseline weights. Log every kg exercise — seeds all Week 2 forecasts. 2 sets × 12 reps.'},
  {label:'Week 2',days:[8,9,10,11,12,13,14],desc:'Targets auto-populate from Week 1. Beat every number. 2 sets × 13 reps.'},
  {label:'Week 3',days:[15,16,17,18,19,20,21],desc:'Sets increase to 3. Forecasts pull from Week 2 weights. 3 sets × 14 reps.'},
  {label:'Week 4',days:[22,23,24,25,26,27,28],desc:'Peak week. 3 sets × 15 reps. Your full progression shows in every exercise.'},
  {label:'+ Days', days:[29,30],            desc:'Final 2 days. Finish strong.'},
];
let currentTab=0;

function buildTabs(){
  const container=document.getElementById('tabs');container.innerHTML='';
  [...WEEKS,{label:'Guide'},{label:'Stats'}].forEach((w,i)=>{
    const done=w.days?w.days.filter(d=>S.dayDone[d]).length:0;
    const div=document.createElement('div');
    div.className='tab'+(currentTab===i?' active':'');
    div.innerHTML=w.label+(done>0?`<span class="cnt">${done}/${w.days.length}</span>`:'');
    div.onclick=()=>{currentTab=i;buildTabs();buildContent();};
    container.appendChild(div);
  });
}

function buildContent(){
  const main=document.getElementById('main');main.innerHTML='';
  if(currentTab<WEEKS.length){
    const wk=WEEKS[currentTab];
    const hdr=document.createElement('div');hdr.className='week-header';
    hdr.innerHTML=`<div class="week-title">WEEK ${currentTab+1}</div><div class="week-desc">${wk.desc}</div>`;
    main.appendChild(hdr);
    wk.days.forEach(day=>main.appendChild(buildDayCard(day)));
  } else if(currentTab===WEEKS.length){
    buildGuide(main);
  } else {
    buildStats(main);
  }
}

function buildGuide(main){
  const hdr=document.createElement('div');hdr.className='week-header';
  hdr.innerHTML='<div class="week-title" style="color:#6a6460">GUIDE</div>';
  main.appendChild(hdr);

  const cards=[
    {title:'How Forecasting Works',color:'#2a8fb0',body:`When you log a weight, the app remembers it.\n\nNext week on the same exercise it shows: "Last week: X kg — aim to beat this" before you log.\n\nOnce you log this week's weight it shows the difference and projects next week (+2.5 kg). Green = you beat last week. Orange = you dropped. No scrolling back through old sessions.`},
    {title:'Weekly Split — Mon to Fri',color:'#e8c97a',body:`Monday — Run + Plyos. Cardio base and explosive power.\nTuesday — Upper Body. Chest, shoulders, back, arms.\nWednesday — Lower Body. Squats, hinge, glutes, hamstrings.\nThursday — Full Body. Compound supersets.\nFriday — Conditioning. Row erg, KB swings, sprints.\nSaturday + Sunday — Rest. Back mobility and jaw still happen.`},
    {title:'Rep Progression',color:'#3d9a68',body:`Week 1: 2 sets × 12 reps\nWeek 2: 2 sets × 13 reps\nWeek 3: 3 sets × 14 reps\nWeek 4: 3 sets × 15 reps\n\nThis keeps every session under 50 minutes while progressively overloading through volume rather than just weight. Combined with the +2.5 kg weekly weight target, you're increasing both reps AND load across the 4 weeks.`},
    {title:'50 Min Session Tips',color:'#2a8fb0',body:`Keep rest to 45–60 sec between sets on hypertrophy work.\nSupersets on Thursday cut time significantly — move straight from one exercise to the other.\nRoman chair warm-up is 3 exercises, under 8 minutes.\nDon't check your phone between sets.\nIf a session is running long, drop the last accessory exercise (curls, pushdowns) — keep the compound lifts.`},
    {title:'Roman Chair Warm-Up',color:'#c9a84c',body:`Every training day. Back extensions build erector spinae directly supporting your scoliosis curve. Side bends and isometric holds train the muscles resisting lateral deviation.\n\nKeep these controlled. 2 sets each, not rushed.`},
    {title:'Back Mobility — S-Curve Specific',color:'#c4603a',body:`Lumbar curves LEFT, thoracic curves RIGHT, left rib hump.\n\nSide bend RIGHT only — opens compressed left lumbar. Never stretch left.\n\nThread the needle LEFT arm bias — counteracts right thoracic curve.\n\nLeft rib breathing — lie on left side, breathe deep, let ribs sink on exhale.\n\nDead hang before and after every lifting session.`},
    {title:'Nutrition — Daily Structure',color:'#d4784a',body:`Breakfast: 55g oats · 150g yogurt · 12g chia · 100g strawberries · 150g watermelon · 1 apple or orange · honey · 1–2 black coffees (~580 cal / 34g protein)\n\nLunch: Egg fried rice — 3 eggs · 185g cooked rice · 100g frozen veg · soy + sesame + garlic (~530 cal / 30g protein)\n\nSnack: 1 piece of fruit on training days. Skip on rest days.\n\nDinner: 180g raw steak · large salad · 200g potato on training days only (~560–720 cal / 47–51g protein)\n\nTraining days: ~1,880 cal total\nRest days: ~1,600 cal total\n\nTaco bowl swap: 150g raw pork mince + El Toro seasoning + 185g cooked rice + 30g cheese + 1 flour tortilla (~620 cal / 38g protein)`},
  ];

  cards.forEach(c=>{
    const card=document.createElement('div');card.className='guide-card';
    card.innerHTML=`<div class="guide-title" style="color:${c.color}">${c.title}</div><div class="guide-body">${c.body}</div>`;
    main.appendChild(card);
  });
}

function buildStats(main){
  const done=Object.values(S.dayDone).filter(Boolean).length;
  const exChecked=Object.values(S.checked).filter(Boolean).length;
  const weights=S.weights||{};
  function heaviest(kw){
    const vals=Object.entries(weights).filter(([k])=>k.includes(kw)).map(([,v])=>parseFloat(v)||0);
    return vals.length?Math.max(...vals):null;
  }
  const dl=heaviest('dead');const bench=heaviest('bench');const squat=heaviest('squat');

  const hdr=document.createElement('div');hdr.className='week-header';
  hdr.innerHTML='<div class="week-title" style="color:#6a6460">YOUR STATS</div>';
  main.appendChild(hdr);

  const grid=document.createElement('div');grid.className='stats-grid';
  [{v:done,l:'Days Complete'},{v:30-done,l:'Days Remaining'},{v:exChecked,l:'Exercises Logged'},{v:Math.round((done/30)*100)+'%',l:'Complete'}]
    .forEach(s=>{
      const box=document.createElement('div');box.className='stat-box';
      box.innerHTML=`<div class="stat-val">${s.v}</div><div class="stat-lbl">${s.l}</div>`;
      grid.appendChild(box);
    });
  main.appendChild(grid);

  if(dl||bench||squat){
    const grid2=document.createElement('div');grid2.className='stats-grid';
    grid2.style.gridTemplateColumns='1fr 1fr 1fr';
    [[dl,'Best Deadlift'],[bench,'Best Bench'],[squat,'Best Squat']].filter(([v])=>v).forEach(([v,l])=>{
      const box=document.createElement('div');box.className='stat-box';
      box.innerHTML=`<div class="stat-val">${v}kg</div><div class="stat-lbl">${l}</div>`;
      grid2.appendChild(box);
    });
    main.appendChild(grid2);
  }

  const card=document.createElement('div');card.className='guide-card';
  card.innerHTML='<div class="guide-title">Week-on-Week Tracking</div><div class="guide-body">Every kg exercise shows last week\'s weight as your target when you open a new week. After you log this week it shows improvement and projects next week automatically.</div>';
  main.appendChild(card);
}

function updateProgress(){
  const done=Object.values(S.dayDone).filter(Boolean).length;
  document.getElementById('prog-val').textContent=`${done} / 30 Days`;
  document.getElementById('prog-fill').style.width=`${(done/30)*100}%`;
}

buildTabs();buildContent();updateProgress();
</script>
